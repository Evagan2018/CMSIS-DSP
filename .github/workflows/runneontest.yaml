name: Neon tests
'on':
  workflow_dispatch: null
permissions:
  actions: read
  security-events: write
jobs:
  CI_test_run:
    runs-on: ubuntu-22.04-arm
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install system packages
      run: |
        sudo add-apt-repository ppa:deadsnakes/ppa
        sudo apt-get install libpython3.12 libtinfo5
        sudo apt install build-essential
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 60 --slave /usr/bin/g++ g++ /usr/bin/g++-11
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 40 --slave /usr/bin/g++ g++ /usr/bin/g++-12
        sudo update-alternatives --set gcc  /usr/bin/gcc-12
    - name: Activate vcpkg
      uses: ARM-software/cmsis-actions/vcpkg@v1
      with:
        config: ./vcpkg-neon-configuration.json
    - name: Prepare framework
      run: "cd Testing\necho \"Create missing folders\"\nmkdir FullBenchmark\nmkdir Output\nmkdir GeneratedInclude\nmkdir\
        \ GeneratedSource\nmkdir GeneratedIncludeBench\nmkdir GeneratedSourceBench\nmkdir build\n\necho \"Install missing\
        \ python packages\"\npip install -r requirements.txt\n\necho \"Generate some missing test patterns\"\npython PatternGeneration/MatrixNeon.py\n\
        \necho \"Preprocess test description\"\npython preprocess.py -f desc.txt -o Output.pickle\npython preprocess.py -f\
        \ desc_neon.txt -o Output_neon.pickle\npython preprocess.py -f desc_f16.txt -o Output_f16.pickle\n\necho \"Generate\
        \ missing CPP headers\"\npython processTests.py -gen . -p Patterns -d Parameters -f Output.pickle -e\npython processTests.py\
        \ -gen . -p Patterns -d Parameters -f Output_neon.pickle -e\npython processTests.py -gen . -p Patterns -d Parameters\
        \ -f Output_f16.pickle -e\n\ncd build\n\ncmake -G \"Ninja\" .. \n"
    - name: Execute generic tests
      run: "cd Testing/build\n\npython ../processTests.py -p ../Patterns -d ../Parameters -gen .. -e -f ../Output.pickle\n\
        ninja \n./test > result.txt\npython ../processResult.py --noerr -e -f ../Output.pickle -r result.txt -html > result.html\
        \ \n"
    - name: Execute neon specific C tests
      run: |
        cd Testing/build

        sh ../test_neon.sh
    - name: Execute f16 C tests
      run: "cd Testing/build\n\npython ../processTests.py -p ../Patterns -d ../Parameters -gen .. -e -f ../Output_f16.pickle\n\
        ninja \n./test > result_f16.txt\npython ../processResult.py --noerr -e -f ../Output_f16.pickle -r result_f16.txt -html\
        \ > result_f16.html \n"
    - name: Upload test report
      uses: actions/upload-artifact@v7
      with:
        name: neon-test-report
        path: |
          Testing/build/result.html
          Testing/build/result_transform_neon.html
          Testing/build/result_binaryf32_neon.html
          Testing/build/result_binary_complexf32_neon.html
          Testing/build/result_binaryf16_neon.html
          Testing/build/result_binary_complexf16_neon.html
          Testing/build/result_binaryq31_neon.html
          Testing/build/result_binary_complexq31_neon.html
          Testing/build/result_binaryq15_neon.html
          Testing/build/result_binary_complexq15_neon.html
          Testing/build/result_binaryq7_neon.html
          Testing/build/result_f16.html
    - name: Check error
      run: |
        cd Testing/build

        echo "Checking output..."
        test "$(grep "FAILED" result.html | wc -l)" -eq 0
        test "$(grep "FAILED" result_transform_neon.html | wc -l)" -eq 0
        test "$(grep "FAILED" result_binaryf32_neon.html | wc -l)" -eq 0
        test "$(grep "FAILED" result_binary_complexf32_neon.html | wc -l)" -eq 0
        test "$(grep "FAILED" result_binaryf16_neon.html | wc -l)" -eq 0
        test "$(grep "FAILED" result_binary_complexf16_neon.html | wc -l)" -eq 0
        test "$(grep "FAILED" result_binaryq31_neon.html | wc -l)" -eq 0
        test "$(grep "FAILED" result_binary_complexq31_neon.html | wc -l)" -eq 0
        test "$(grep "FAILED" result_binaryq15_neon.html | wc -l)" -eq 0
        test "$(grep "FAILED" result_binary_complexq15_neon.html | wc -l)" -eq 0
        test "$(grep "FAILED" result_binaryq7_neon.html | wc -l)" -eq 0
        test "$(grep "FAILED" result_f16.html | wc -l)" -eq 0
