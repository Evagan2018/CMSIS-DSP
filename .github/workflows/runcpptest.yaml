name: CPP Tests
'on':
  workflow_dispatch: null
permissions:
  actions: read
  security-events: write
jobs:
  CI_cpp_test_run:
    strategy:
      max-parallel: 6
      fail-fast: false
      matrix:
        compiler:
        - AC6
        - CLANG
        core:
        - M0
        - M4
        - M55
        dt:
        - F64_DT
        - COMPLEX_F32_DT
        - F32_DT
        - COMPLEX_F16_DT
        - F16_DT
        - COMPLEX_Q31_DT
        - Q31_DT
        - COMPLEX_Q15_DT
        - Q15_DT
        - Q7_DT
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        repository: Evagan2018/CMSIS-DSP
        ref: cmsis-pack-6.4.0-test-20261013-083944
    - name: Setup Python 3.10
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
        cache: pip
        cache-dependency-path: Testing/requirements.txt
    - name: Install system packages
      run: |
        sudo add-apt-repository ppa:deadsnakes/ppa
        sudo apt-get install libpython3.9 libtinfo5
    - name: Activate vcpkg
      uses: ARM-software/cmsis-actions/vcpkg@v1
    - name: Activate Arm tool license
      uses: ARM-software/cmsis-actions/armlm@v1
    - name: Cache boost
      id: cache-boost
      uses: actions/cache@v6
      with:
        key: boost-cmsis-dsp
        restore-keys: |
          boost-cmsis-dsp
        path: ${{ github.workspace }}/boost_1_84_0
    - name: Install boost
      if: steps.cache-boost.outputs.cache-hit != 'true'
      run: |
        echo "Install boost"
        curl -o boost.tar.gz https://archives.boost.io/release/1.84.0/source/boost_1_84_0.tar.gz
        tar -xf boost.tar.gz
    - name: Install CMSIS 6.4.0 qualification probe
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        mkdir -p "$RUNNER_TEMP/cmsis-pack-test"
        cat > "$RUNNER_TEMP/cmsis-pack-test/probe.py" <<'CMSIS_PROBE_EOF'
        #!/usr/bin/env python3
        """Ephemeral runner instrumentation for the CMSIS 6.4.0 campaign (stdlib only)."""
        import json, os, re, shutil, subprocess, sys, time, hashlib
        from pathlib import Path

        TARGET = 'ARM::CMSIS@6.4.0'
        HOME = Path(os.environ.get('RUNNER_TEMP', '.')) / 'cmsis-pack-test'
        WORKSPACE = Path(os.environ.get('GITHUB_WORKSPACE', '.')).resolve()
        SKIP = {'.git', '.packs', '.Download', 'node_modules', 'boost_1_84_0'}

        def files(root=WORKSPACE):
            for base, dirs, names in os.walk(root):
                dirs[:] = [d for d in dirs if d not in SKIP and not Path(base, d).is_symlink()]
                for name in names:
                    if name.endswith(('.yml', '.yaml')):
                        yield Path(base, name)

        def pin(text, lock=False):
            lines = text.splitlines(keepends=True)
            result = []
            i = 0
            key = 'resolved-pack' if lock else 'pack'
            pattern = re.compile(r'^(\s*)-\s+' + key + r':\s*[\"\x27]?ARM::CMSIS(?=[@\s\"\x27]|$)', re.I)
            while i < len(lines):
                match = pattern.match(lines[i])
                if not match:
                    result.append(lines[i]); i += 1; continue
                indent = len(match[1])
                j = i + 1
                while j < len(lines):
                    line = lines[j]
                    if line.strip() and not line.lstrip().startswith('#') and len(line) - len(line.lstrip()) <= indent:
                        break
                    j += 1
                if not lock:
                    result.append(match[1] + '- pack: ' + TARGET + '\n')
                    result.extend(x for x in lines[i+1:j] if not re.match(r'^\s+path:', x))
                i = j
            return ''.join(result)

        def prepare():
            changed = []
            for path in files():
                if not path.name.endswith(('.csolution.yml', '.cproject.yml', '.clayer.yml', '.cbuild-pack.yml')):
                    continue
                old = path.read_text(encoding='utf-8-sig')
                new = pin(old, path.name.endswith('.cbuild-pack.yml'))
                if old != new:
                    path.write_text(new, encoding='utf-8')
                    changed.append(str(path.relative_to(WORKSPACE)))
            return changed

        def emit(record):
            HOME.mkdir(parents=True, exist_ok=True)
            with (HOME/'evidence.jsonl').open('a', encoding='utf-8') as f:
                f.write(json.dumps(record) + '\n')
            print('CMSIS_PACK_TEST_RESULT ' + json.dumps(record), flush=True)

        def wrapper():
            args = sys.argv[1:]
            real = (HOME/'real-cbuild.txt').read_text().strip()
            if not any('.csolution.' in a for a in args) or any(a in args for a in ['--help', '--version', 'list', 'clean']):
                return subprocess.call([real] + args)
            changed = prepare()
            def option(*names):
                return next((args[i+1] for i,a in enumerate(args[:-1]) if a in names), '')
            identity = json.dumps([str(Path.cwd()), next(a for a in args if '.csolution.' in a),
                                   option('-c','--context'),option('--toolchain'),option('--active'),option('-O','--output')])
            known_path=HOME/('known-'+hashlib.sha256(identity.encode()).hexdigest()+'.json')
            known=json.loads(known_path.read_text()) if known_path.exists() else {}
            before = {str(p): p.stat().st_mtime_ns for p in files() if p.name.endswith('.cbuild.yml')}
            started = time.time()
            rc = subprocess.call([real] + args)
            evidence = []; current={}
            for p in files():
                if not p.name.endswith('.cbuild.yml'):
                    continue
                text = p.read_text(encoding='utf-8-sig')
                digest=hashlib.sha256(text.encode()).hexdigest()
                fresh=before.get(str(p)) != p.stat().st_mtime_ns
                if not fresh and known.get(str(p))!=digest:
                    continue
                packs = sorted(set(re.findall(r'(?:pack|from-pack):\s*[\"\x27]?(ARM::CMSIS@[^\s\"\x27]+)', text)))
                if packs:
                    ctx = re.search(r'^\s*context:\s*(.+)$', text, re.M)
                    evidence.append({'file':str(p.relative_to(WORKSPACE)), 'context':ctx[1].strip() if ctx else p.name,
                                     'packs':packs, 'verified':packs == [TARGET],
                                     'metadata':'newly written' if fresh else 'unchanged; same solution/context/toolchain invocation'})
                    current[str(p)]=digest
            known_path.write_text(json.dumps(current))
            build_action = not any(a in args for a in ['setup', 'convert'])
            good = bool(evidence) and all(e['verified'] for e in evidence)
            record = {'kind':'build' if build_action else 'setup','cwd':str(Path.cwd()),'args':args,
                      'returncode':rc,'version_verified':good,'contexts':evidence,'patched_inputs':changed,
                      'seconds':round(time.time()-started,2)}
            emit(record)
            # Preserve the builder return code. The always-run final check separately rejects
            # missing/wrong evidence and failures swallowed by upstream scripts.
            return rc

        def install():
            HOME.mkdir(parents=True, exist_ok=True)
            prepare()
            bindir = HOME/'bin'; bindir.mkdir(exist_ok=True)
            if not (HOME/'real-cbuild.txt').exists():
                real = shutil.which('cbuild')
                if not real:
                    raise RuntimeError('cbuild unavailable at qualification setup')
                (HOME/'real-cbuild.txt').write_text(real)
                wrapper_path = bindir/'cbuild'
                wrapper_path.write_text('#!/bin/sh\nexec python3 "' + str(HOME/'probe.py') + '" "$@"\n')
                wrapper_path.chmod(0o755)
                with open(os.environ['GITHUB_PATH'], 'a') as f:
                    f.write(str(bindir)+'\n')
            print('CMSIS_PACK_TEST_SETUP target=' + TARGET, flush=True)

        def finish():
            path = HOME/'evidence.jsonl'
            if not path.exists():
                print('::error::No instrumented cbuild invocation reached; CMSIS 6.4.0 not verified')
                return 1
            records = [json.loads(line) for line in path.read_text().splitlines() if line]
            for r in records:
                print('CMSIS_PACK_TEST_FINAL ' + json.dumps(r), flush=True)
            builds = [r for r in records if r['kind']=='build']
            good = bool(builds) and all(r['returncode']==0 and r['version_verified'] for r in builds)
            print('CMSIS_PACK_TEST_GATE ' + json.dumps({'passed':good,'build_invocations':len(builds)}))
            return 0 if good else 1

        if __name__ == '__main__':
            if sys.argv[1:] == ['--probe-install']:
                install()
            elif sys.argv[1:] == ['--probe-finish']:
                sys.exit(finish())
            else:
                sys.exit(wrapper())

        CMSIS_PROBE_EOF
        python3 "$RUNNER_TEMP/cmsis-pack-test/probe.py" --probe-install
    - name: Prepare framework
      run: |
        cd dsppp
        echo "Create missing folders"
        mkdir AC6_results
        mkdir CLANG_results
        mkdir GCC_results

        echo "Install missing python packages"
        pip install -r ../Testing/requirements.txt

        echo "Load missing pack"
        csolution list packs -s test.csolution.yml -m > required_packs.txt

        cat required_packs.txt
        cpackget add -a -f required_packs.txt
    - name: Execute
      run: |
        cd dsppp
        echo "Running tests"
        python run_all.py -t -g ${{ matrix.compiler }} -c ${{ matrix.core }} --dt ${{matrix.dt}} -avh $AVH_FVP_PLUGINS/../bin
    - name: Upload test report
      uses: actions/upload-artifact@v7
      with:
        name: test-cpp-report_${{ matrix.compiler }}_${{ matrix.core }}_${{ matrix.dt }}
        path: dsppp/${{ matrix.compiler }}_results/errors_${{ matrix.core }}_${{ matrix.dt }}.txt
    - name: Check error
      run: |
        cd dsppp
        echo "Checking output..."
        test "$(cat ${{ matrix.compiler }}_results/errors_${{ matrix.core }}_${{ matrix.dt }}.txt | wc -l)" -eq 0
    - name: Verify CMSIS 6.4.0 build evidence
      if: always()
      shell: bash
      working-directory: ${{ github.workspace }}
      run: python3 "$RUNNER_TEMP/cmsis-pack-test/probe.py" --probe-finish
run-name: CMSIS 6.4.0 qualification - runcpptest.yaml
